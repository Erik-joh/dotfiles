gui:
  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#3b4261"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    selectedRangeBgColor:
      - "#283457"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    unstagedChangesColor:
      - "#f7768e"
    defaultFgColor:
      - "#c0caf5"
    searchingActiveBorderColor:
      - "#ff9e64"
  nerdFontsVersion: "3"
  mouseEvents: false
os:
  editPreset: nvim
  open: '/opt/homebrew/bin/nvim {{filename}}'
  openLink: '/opt/homebrew/bin/nvim {{filename}}'
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
